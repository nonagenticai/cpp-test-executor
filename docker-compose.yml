services:
  cpp-test-executor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cpp-test-executor
    ports:
      - "0.0.0.0:8094:8094"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      PORT: 8094
      TEST_MODE: "true"
    networks:
      - workflow-system-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8094/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  workflow-system-network:
    driver: bridge
